<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RipperDoc</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="light-theme">
  <div class="app-container">
    <!-- Header with Logo & Target URL Instructions -->
    <header class="app-header">
      <div class="logo-wrapper">
        <img src="assets/logo.png" alt="RipperDoc - Asset Extractor Web to Canvas" class="header-logo" />
      </div>
      
      <!-- Awaiting Target URL moved below the main logo -->
      <div class="header-instruction">
        <h3 class="awaiting-title">AWAITING TARGET URL</h3>
        <p class="awaiting-desc">Paste a website link below to extract all image, vector, video, and audio assets ready to drop into Photoshop.</p>
      </div>

      <!-- Centered Developer Tag -->
      <div class="header-meta">
        <span class="creator-tag">DEV // NEPHUXS</span>
      </div>
    </header>

    <!-- URL Input Section -->
    <section class="search-section">
      <div class="input-wrapper">
        <input 
          type="url" 
          id="urlInput" 
          placeholder="https://example.com" 
          spellcheck="false"
          autocomplete="off"
        />
      </div>

      <div class="button-row">
        <button id="ripBtn" class="btn btn-rip">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
          </svg>
          <span id="ripBtnText">HARVEST ASSETS</span>
        </button>
      </div>
    </section>

    <!-- Controls & Multi-Colored Filter Tabs (Single Row with Designed Icons) -->
    <section class="controls-section">
      <div class="filter-tabs" id="filterTabs">
        <div class="filter-col">
          <button class="tab-btn tab-all active" data-filter="all" title="All Files">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <rect x="3" y="3" width="7" height="7" rx="1"></rect>
              <rect x="14" y="3" width="7" height="7" rx="1"></rect>
              <rect x="14" y="14" width="7" height="7" rx="1"></rect>
              <rect x="3" y="14" width="7" height="7" rx="1"></rect>
            </svg>
            <span class="tab-label">ALL</span>
          </button>
          <span class="tab-count" id="countAll">0</span>
        </div>

        <div class="filter-col">
          <button class="tab-btn tab-png" data-filter="png" title="PNG Images">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <rect x="3" y="3" width="18" height="18" rx="2"></rect>
              <circle cx="8.5" cy="8.5" r="1.5"></circle>
              <polyline points="21 15 16 10 5 21"></polyline>
            </svg>
            <span class="tab-label">PNG</span>
          </button>
          <span class="tab-count" id="countPng">0</span>
        </div>

        <div class="filter-col">
          <button class="tab-btn tab-jpg" data-filter="jpg" title="JPG Photos">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
              <circle cx="12" cy="13" r="4"></circle>
            </svg>
            <span class="tab-label">JPG</span>
          </button>
          <span class="tab-count" id="countJpg">0</span>
        </div>

        <div class="filter-col">
          <button class="tab-btn tab-svg" data-filter="svg" title="Vector SVG">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
              <path d="M2 17l10 5 10-5"></path>
              <path d="M2 12l10 5 10-5"></path>
            </svg>
            <span class="tab-label">SVG</span>
          </button>
          <span class="tab-count" id="countSvg">0</span>
        </div>

        <div class="filter-col">
          <button class="tab-btn tab-gif" data-filter="gif" title="GIF Animations">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <rect x="2" y="2" width="20" height="20" rx="2"></rect>
              <line x1="7" y1="2" x2="7" y2="22"></line>
              <line x1="17" y1="2" x2="17" y2="22"></line>
              <line x1="2" y1="12" x2="22" y2="12"></line>
            </svg>
            <span class="tab-label">GIF</span>
          </button>
          <span class="tab-count" id="countGif">0</span>
        </div>

        <div class="filter-col">
          <button class="tab-btn tab-video" data-filter="video" title="Video Clips">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <polygon points="23 7 16 12 23 17 23 7"></polygon>
              <rect x="1" y="5" width="15" height="14" rx="2"></rect>
            </svg>
            <span class="tab-label">VID</span>
          </button>
          <span class="tab-count" id="countVideo">0</span>
        </div>

        <div class="filter-col">
          <button class="tab-btn tab-audio" data-filter="audio" title="Audio Tracks">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M9 18V5l12-2v13"></path>
              <circle cx="6" cy="18" r="3"></circle>
              <circle cx="18" cy="16" r="3"></circle>
            </svg>
            <span class="tab-label">AUD</span>
          </button>
          <span class="tab-count" id="countAudio">0</span>
        </div>
      </div>

      <!-- Toolbar: Centered Preview Scale Slider -->
      <div class="toolbar">
        <div class="slider-group">
          <span class="slider-label">PREVIEW SCALE:</span>
          <input type="range" id="sizeSlider" min="70" max="250" value="115" step="5" />
          <span id="sizeValue" class="slider-value">115px</span>
        </div>
      </div>
    </section>

    <!-- Status message / Progress banner -->
    <div id="statusBanner" class="status-banner" style="display: none;">
      <div class="cyber-spinner"></div>
      <span id="statusMessage">EXTRACTION IN PROGRESS...</span>
    </div>

    <!-- Results Gallery -->
    <main class="results-container" id="resultsContainer">
      <!-- Empty State (No black box icon) -->
      <div class="empty-state" id="emptyState">
        <p class="empty-desc">No assets harvested yet. Enter a website URL above and click <strong>HARVEST ASSETS</strong>.</p>
      </div>

      <!-- Asset Grid (Flexbox wrapping grid for UXP) -->
      <div class="asset-grid" id="assetGrid"></div>
    </main>

    <!-- Bottom Action Footer with REBOOT Button -->
    <footer class="app-footer" id="appFooter">
      <div class="footer-stats">
        <span id="visibleStats">READY</span>
      </div>
      <button id="rebootBtn" class="btn-reboot" title="Clear URL and reset all harvested assets">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="23 4 23 10 17 10"></polyline>
          <polyline points="1 20 1 14 7 14"></polyline>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
        </svg>
        <span>REBOOT</span>
      </button>
    </footer>
  </div>

  <!-- Cyber Notification Toast -->
  <div id="toast" class="toast"></div>

  <script src="main.js"></script>
</body>
</html>
